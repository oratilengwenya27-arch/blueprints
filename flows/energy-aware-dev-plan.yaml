id: energy-aware-dev-plan
namespace: personal
description: |
  Most morning plans ignore how much energy you actually have.
  This flow checks the weather, looks at your open GitHub work,
  and gives you a more realistic plan based on your current energy level.
  Made because I kept starting days with unrealistic to-do lists.

inputs:
  - id: city
    type: STRING
    defaults: Pretoria
    description: City for weather

  - id: energy
    type: SELECT
    defaults: medium
    values:
      - low
      - medium
      - high
    description: How much energy do you have right now?

  - id: github_user
    type: STRING
    defaults: your-github-username
    description: Your GitHub username

  - id: notify_email
    type: STRING
    defaults: your-email@example.com
    description: Email address to send the plan to

tasks:
  - id: get_weather
    type: io.kestra.plugin.core.http.Request
    uri: "https://wttr.in/{{ inputs.city }}?format=3"
    method: GET
    allowFailure: true

  - id: get_github_issues
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/search/issues?q=assignee:{{ inputs.github_user }}+is:open&per_page=5"
    headers:
      Accept: application/vnd.github+json
      User-Agent: "kestra-energy-plan"
    allowFailure: true

  - id: get_github_prs
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/search/issues?q=author:{{ inputs.github_user }}+is:pr+is:open&per_page=5"
    headers:
      Accept: application/vnd.github+json
      User-Agent: "kestra-energy-plan"
    allowFailure: true

  - id: build_plan
    type: io.kestra.plugin.core.debug.Return
    format: |
      Morning plan

      Weather: {{ outputs.get_weather.body | default("Weather unavailable") }}
      Energy: {{ inputs.energy }}

      {% if inputs.energy == 'low' %}
      Recommendation:
      - Keep the day light
      - Only touch the most urgent items
      - Avoid starting anything new if possible
      {% elseif inputs.energy == 'medium' %}
      Recommendation:
      - Pick one main focus
      - Clear one important issue or PR
      - Leave the afternoon lighter
      {% else %}
      Recommendation:
      - Good day for deeper work
      - Take on something that actually matters
      - Still don’t overload the day
      {% endif %}

      Open work (from GitHub):
      - Assigned issues: {{ outputs.get_github_issues.body.total_count | default(0) }}
      - Open PRs you authored: {{ outputs.get_github_prs.body.total_count | default(0) }}

      Note: This is just a realistic starting point. Adjust as needed.

  - id: send_plan
    type: io.kestra.plugin.email.MailSend
    from: "{{ secret('EMAIL_FROM') }}"
    to: "{{ inputs.notify_email }}"
    host: "{{ secret('SMTP_HOST') }}"
    port: 587
    username: "{{ secret('SMTP_USERNAME') }}"
    password: "{{ secret('SMTP_PASSWORD') }}"
    transportStrategy: SMTP_TLS
    subject: "Energy-aware plan ({{ inputs.energy }})"
    plainTextContent: "{{ outputs.build_plan.value }}"

triggers:
  - id: morning
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"
    disabled: true